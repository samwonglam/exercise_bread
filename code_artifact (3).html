<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>香海正覺蓮社佛教正慧小學｜2026-2027 三年級數學科課業：小三除法 5 大題型視覺化分物助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --main:#1e6091;
  --main2:#124366;
  --teal:#2a9d8f;
  --teal2:#1f7a6f;
  --warm:#e07a2e;
  --warm2:#b85d18;
  --red:#d9386a;
  --red2:#a31d47;
  --green:#2b9348;
  --green2:#1b6330;
  --purple:#7c3aed;
  --dark:#1e293b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Noto Sans TC',"PingFang HK","Microsoft JhengHei",sans-serif;
  color:var(--dark);
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(135deg,#eef5fb 0%,#f8fafc 50%,#edf6f9 100%);
  padding-bottom:48px;
  user-select:none;
  -webkit-user-select:none;
}
.hidden{display:none!important}
button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:900;
  padding:9px 15px;
  min-height:42px;
  transition:transform .12s,box-shadow .12s,background .15s;
}
.btn{background:linear-gradient(180deg,#2b7bb9,var(--main));color:#fff;box-shadow:0 4px 0 var(--main2),0 6px 12px rgba(30,96,145,.2)}
.btn.teal{background:linear-gradient(180deg,#3cbfae,var(--teal));color:#fff;box-shadow:0 4px 0 var(--teal2),0 6px 12px rgba(42,157,143,.2)}
.btn.warm{background:linear-gradient(180deg,#f59e0b,var(--warm));color:#fff;box-shadow:0 4px 0 var(--warm2),0 6px 12px rgba(224,122,46,.22)}
.btn.red{background:linear-gradient(180deg,#ec4899,var(--red));color:#fff;box-shadow:0 4px 0 var(--red2),0 6px 12px rgba(217,56,106,.22)}
.btn.green{background:linear-gradient(180deg,#40b560,var(--green));color:#fff;box-shadow:0 4px 0 var(--green2),0 6px 12px rgba(43,147,72,.22)}
.btn.gray{background:linear-gradient(180deg,#94a3b8,#64748b);color:#fff;box-shadow:0 4px 0 #475569,0 6px 10px rgba(0,0,0,.12)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.pulse{animation:pulseBtn 1.3s infinite}
@keyframes pulseBtn{50%{transform:scale(1.04);box-shadow:0 4px 0 var(--red2),0 0 18px rgba(217,56,106,.55)}}

/* ===== 頂部校本導航列 ===== */
header.top{
  position:sticky;
  top:0;
  z-index:40;
  background:linear-gradient(90deg,#1e6091,#2a7fb8,#2a9d8f);
  color:#fff;
  padding:10px 18px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 4px 14px rgba(15,23,42,.18);
}
header .title{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px}
header .title small{display:block;font-weight:700;font-size:12.5px;opacity:.92}
.mascotBadge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.45);
  border-radius:99px;
  padding:4px 12px;
  font-size:13.5px;
  font-weight:900;
}

/* ===== 題目切換分頁列（共 5 題） ===== */
.tabs{
  max-width:1100px;
  margin:14px auto 0;
  padding:0 16px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}
.tab{
  background:#fff;
  color:var(--dark);
  border:2.5px solid #cbd5e1;
  box-shadow:0 4px 0 #cbd5e1;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:15.5px;
  padding:9px 16px;
}
.tab .o{--s:24px}
.tab.on{
  background:#eff6ff;
  border-color:var(--main);
  color:var(--main);
  box-shadow:0 4px 0 var(--main);
  transform:translateY(-2px);
}

/* ===== 全寬度純分物版面（頂部題目卡 ＋ 下方大型 3D 具象化分物舞台） ===== */
.mainSingle{
  max-width:1100px;
  margin:14px auto 0;
  padding:0 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.qBannerCard{
  background:#fff;
  border:2.5px solid #93c5fd;
  border-radius:18px;
  padding:14px 18px;
  box-shadow:0 6px 0 #dbeafe,0 10px 20px rgba(15,23,42,.06);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.wsQuestionBox{
  font-size:21px;
  font-weight:900;
  line-height:1.6;
  color:#0f172a;
  flex:1;
  min-width:260px;
}
.wsKeywordBox{
  display:inline-block;
  padding:0 4px;
  border-radius:6px;
  transition:all .2s;
}
.wsKeywordBox.circled{
  border:2px solid var(--red);
  background:#fef08a;
  color:#9a3412;
  box-shadow:0 0 0 3px rgba(250,204,21,.45);
}

/* ===== 3D 具象化分物舞台 ===== */
.scene{
  border-radius:22px;
  padding:18px;
  box-shadow:0 12px 30px rgba(15,23,42,.1),inset 0 0 0 3px rgba(255,255,255,.85);
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border:2.5px solid #cbd5e1;
}
.scene::before{
  content:'';
  position:absolute;
  left:-50%;right:-50%;bottom:-8%;height:52%;
  z-index:-1;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.65) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.65) 2px,transparent 2px);
  background-size:44px 44px;
  transform:perspective(420px) rotateX(62deg);
  transform-origin:bottom;
}
.scene.ribbon-theme{background:linear-gradient(180deg,#fff0f6,#fff8fb 55%,#fce7f3)}
.scene.game-theme{background:linear-gradient(180deg,#eef2ff,#f8fafc 55%,#e0e7ff)}
.scene.camp-theme{background:linear-gradient(180deg,#ecfdf5,#f0fdf4 55%,#d1fae5)}
.scene.berry-theme{background:linear-gradient(180deg,#fff1f2,#fff5f5 55%,#ffe4e6)}
.scene.choir-theme{background:linear-gradient(180deg,#fef9c3,#fffbeb 55%,#fde68a)}

.zoneHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin:6px 0 8px;
}
.zoneTitle{font-weight:900;font-size:17px;color:var(--dark);display:flex;align-items:center;gap:8px}
.tag{background:#fff;border:2px solid #cbd5e1;border-radius:99px;padding:3px 12px;font-size:13.5px;color:var(--main);font-weight:900}
.tag.rem-alert{background:#fff1f2;border-color:var(--red);color:var(--red)}

/* 3D 仿真立體物件與十位包裝 */
.o{
  display:inline-flex;
  width:var(--s,36px);
  height:var(--s,36px);
  flex:0 0 auto;
  touch-action:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));
  transition:transform .18s cubic-bezier(.2,.8,.3,1);
}
.o svg{width:100%;height:100%;pointer-events:none;overflow:visible}
.item{cursor:pointer}
.item:hover{transform:translateY(-5px) rotate(-6deg) scale(1.13)}
.pop{animation:pop .48s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:perspective(400px) translateZ(100px) rotateY(180deg) scale(.2)}to{transform:none}}
.ghost{opacity:.3;filter:grayscale(.45)}

.pack{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  padding:6px 10px 4px;
  border-radius:14px;
  background:rgba(255,255,255,.88);
  border:2px solid #94a3b8;
  transition:transform .2s,box-shadow .2s;
}
.pack:hover{transform:perspective(600px) rotateX(10deg) translateY(-4px) scale(1.04);box-shadow:0 8px 16px rgba(0,0,0,.12)}
.tube{
  position:relative;
  display:flex;
  align-items:center;
  padding:4px 10px;
  border-radius:18px;
  border:2px solid #fff;
  background:linear-gradient(180deg,#fef9c3,#fde047);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.12),0 5px 8px rgba(0,0,0,.14);
}
.tube .o{margin:0 -4px}
.pack small{font-weight:900;margin-top:4px;color:var(--dark);font-size:12px}
.pack b{font-size:11.5px;color:var(--red);font-weight:900}

/* 待分物品區（分物後餘數直接保留在此） */
.supply{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  min-height:92px;
  padding:12px;
  background:rgba(255,255,255,.9);
  border:2.5px dashed var(--warm);
  border-radius:16px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.05);
  transition:all .25s ease;
}
.supply.rem-mode{
  border:3px solid var(--red);
  background:#fff1f2;
  box-shadow:0 0 0 4px rgba(217,56,106,.15);
}
.supply .rem-item{
  cursor:pointer;
  animation:glowO .85s infinite alternate;
}
@keyframes glowO{to{filter:drop-shadow(0 0 8px #f43f5e) drop-shadow(0 0 3px #f43f5e)}}

/* ===== 閃動流光與呼吸動畫特效 ===== */
@keyframes shimmerSweep{
  0%{transform:translateX(-120%) skewX(-25deg)}
  100%{transform:translateX(260%) skewX(-25deg)}
}
@keyframes twinkleStar{
  0%,100%{opacity:.25;transform:scale(.75) rotate(0deg)}
  50%{opacity:1;transform:scale(1.25) rotate(20deg);filter:drop-shadow(0 0 6px #fde047)}
}
@keyframes warmGlowPulse{
  0%,100%{filter:drop-shadow(0 4px 6px rgba(245,158,11,.25))}
  50%{filter:drop-shadow(0 0 14px rgba(250,204,21,.75))}
}
.twinkle{animation:twinkleStar 1.8s ease-in-out infinite}
.glow-item{animation:warmGlowPulse 2s ease-in-out infinite}

/* ===== 第 1 題專屬：長 90 厘米絲帶量尺與真實剪刀裁剪動畫 ===== */
.ribbonSpoolWrap{
  width:100%;
  padding:14px 8px 10px;
  position:relative;
}
.ribbonRulerTicks{
  display:flex;
  justify-content:space-between;
  font-size:11.5px;
  font-weight:900;
  color:#64748b;
  padding:0 2px 4px;
  border-bottom:1.5px solid #cbd5e1;
  margin-bottom:8px;
}
.ribbonBarOuter{
  position:relative;
  width:100%;
  padding:10px 0;
}
.ribbonBarTrack{
  width:100%;
  height:44px;
  background:#f1f5f9;
  border:2.5px solid #94a3b8;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  position:relative;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.12);
}
.ribbonCutSeg{
  height:100%;
  background:repeating-linear-gradient(45deg,#fbcfe8,#fbcfe8 6px,#f9a8d4 6px,#f9a8d4 12px);
  border-right:2.5px dashed #be185d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:#831843;
  opacity:.55;
  position:relative;
}
.ribbonCutSeg.just-cut{
  animation:cutSegBounce .55s cubic-bezier(.2,1.4,.4,1);
  opacity:.85;
  background:linear-gradient(180deg,#f472b6,#ec4899);
  color:#fff;
}
@keyframes cutSegBounce{
  0%{transform:scaleY(1.25);filter:brightness(1.5)}
  40%{transform:translateY(6px) rotate(-3deg)}
  100%{transform:none}
}
.ribbonUncutSeg{
  height:100%;
  background:linear-gradient(90deg,#ec4899,#db2777,#f43f5e);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:14px;
  transition:width .32s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 0 12px rgba(236,72,153,.4);
  position:relative;
  overflow:hidden;
}
.ribbonUncutSeg::after{
  content:'';
  position:absolute;
  top:0;bottom:0;width:35%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:shimmerSweep 2.6s infinite;
}
.ribbonUncutSeg.rem-only{
  background:linear-gradient(90deg,#e11d48,#be123c);
  animation:pulseBtn 1s infinite;
}
/* 真實剪刀定位與開合動畫 */
.scissorActor{
  position:absolute;
  top:-16px;
  width:54px;
  height:54px;
  margin-left:-27px;
  z-index:15;
  pointer-events:none;
  transition:left .28s cubic-bezier(.2,.8,.3,1), opacity .2s;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.28));
}
.scissorActor .blade-top{
  transform-origin:28px 28px;
  transition:transform .12s;
}
.scissorActor .blade-bot{
  transform-origin:28px 28px;
  transition:transform .12s;
}
.scissorActor.snipping{
  animation:scissorMoveDown .42s ease-in-out;
}
.scissorActor.snipping .blade-top{
  animation:snipTop .42s ease-in-out;
}
.scissorActor.snipping .blade-bot{
  animation:snipBot .42s ease-in-out;
}
@keyframes scissorMoveDown{
  0%{transform:translateY(-8px) scale(1.05)}
  45%{transform:translateY(14px) scale(1.18)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes snipTop{
  0%{transform:rotate(-28deg)}
  45%{transform:rotate(8deg)}
  75%{transform:rotate(-22deg)}
  100%{transform:rotate(-14deg)}
}
@keyframes snipBot{
  0%{transform:rotate(28deg)}
  45%{transform:rotate(-8deg)}
  75%{transform:rotate(22deg)}
  100%{transform:rotate(14deg)}
}
.cutFlashLine{
  position:absolute;
  top:4px;bottom:4px;
  width:4px;
  margin-left:-2px;
  background:#fff;
  box-shadow:0 0 12px 4px #fef08a, 0 0 20px 6px #f43f5e;
  border-radius:99px;
  z-index:14;
  opacity:0;
  pointer-events:none;
}
.cutFlashLine.flash{
  animation:flashCutAnim .45s ease-out;
}
@keyframes flashCutAnim{
  0%{opacity:1;transform:scaleY(1.3)}
  100%{opacity:0;transform:scaleY(.2)}
}
.bowShowcaseGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  gap:10px;
  margin-top:8px;
}
.bowCard{
  background:#fff;
  border:2.5px solid #f472b6;
  border-radius:14px;
  padding:8px 6px;
  text-align:center;
  box-shadow:0 5px 0 #fbcfe8;
  animation:pop .4s ease-out both;
  position:relative;
  overflow:hidden;
}
.bowCard::after{
  content:'✨';
  position:absolute;
  top:4px;right:6px;
  font-size:12px;
  animation:twinkleStar 2s infinite;
}
.bowCard.rem-card{
  border-color:var(--red);
  border-style:dashed;
  background:#fff1f2;
  box-shadow:0 5px 0 #fecdd3;
}
.bowCard b{display:block;font-size:13.5px;color:#9d174d;margin-top:2px}
.bowCard small{font-size:11.5px;color:#64748b;font-weight:800}

/* ===== 第 2 題專屬：手機遊戲 6 個金幣解鎖隱藏角色機台 ===== */
.heroUnlockGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
  gap:10px;
}
.heroPodCard{
  background:linear-gradient(180deg,#ffffff,#eef2ff);
  border:2.5px solid #6366f1;
  border-radius:16px;
  padding:8px;
  text-align:center;
  box-shadow:0 6px 0 #c7d2fe;
  position:relative;
}
.heroPodCard.unlocked{
  border-color:#16a34a;
  background:linear-gradient(180deg,#f0fdf4,#dcfce7);
  box-shadow:0 6px 0 #86efac;
}
.heroPodCard.not-enough{
  border-color:var(--red);
  border-style:dashed;
  background:#fff1f2;
  box-shadow:none;
}
.coinSlots6{
  display:grid;
  grid-template-columns:repeat(3,28px);
  gap:4px;
  justify-content:center;
  margin:6px auto;
  padding:5px;
  background:rgba(255,255,255,.8);
  border-radius:10px;
  border:1.5px solid #cbd5e1;
}
.cSlot{
  width:28px;height:28px;
  border-radius:50%;
  border:1.5px dashed #94a3b8;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8fafc;
}
.cSlot.filled{border:2px solid #d97706;background:#fef3c7}
.cSlot .o{--s:23px}

/* ===== 第 3 題專屬：秋季大露營立體真實帳篷（6 人帳篷） ===== */
.tentGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:12px;
}
.tentCard{
  background:linear-gradient(180deg,#f0fdf4 0%,#dcfce7 65%,#bbf7d0 100%);
  border:2.5px solid #059669;
  border-radius:18px;
  padding:10px 8px 8px;
  text-align:center;
  box-shadow:0 7px 0 #6ee7b7, 0 10px 18px rgba(5,150,105,.12);
  position:relative;
  overflow:hidden;
  transition:transform .2s, box-shadow .2s;
}
.tentCard:hover{
  transform:translateY(-3px);
}
.tentCard.full-tent{
  border-color:#15803d;
  background:linear-gradient(180deg,#ecfdf5 0%,#d1fae5 60%,#a7f3d0 100%);
  box-shadow:0 7px 0 #34d399, 0 0 16px rgba(16,185,129,.25);
}
.tentCard.extra-tent{
  border-color:var(--warm);
  background:linear-gradient(180deg,#fffbeb,#fef3c7);
  box-shadow:0 7px 0 #fbbf24, 0 0 18px rgba(245,158,11,.35);
  animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;
}
.tentVisualHeader{
  position:relative;
  height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:2px;
}
.tentVisualHeader .tent-svg-wrap{
  width:116px;
  height:72px;
  filter:drop-shadow(0 5px 5px rgba(6,78,59,.28));
  transition:transform .25s;
}
.tentCard.full-tent .tent-svg-wrap{
  animation:warmGlowPulse 2.2s infinite;
}
.tentStarDeco{
  position:absolute;
  top:2px;
  right:8px;
  font-size:14px;
  animation:twinkleStar 1.6s infinite;
}
.tentLanternTag{
  position:absolute;
  top:4px;
  left:8px;
  font-size:11px;
  font-weight:900;
  background:rgba(255,255,255,.88);
  color:#065f46;
  padding:1px 7px;
  border-radius:99px;
  border:1.5px solid #34d399;
}
.camperSlots6{
  display:grid;
  grid-template-columns:repeat(3,34px);
  gap:5px;
  justify-content:center;
  margin:4px auto 6px;
  padding:6px;
  background:rgba(255,255,255,.82);
  border-radius:12px;
  border:2px solid #34d399;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.06);
}
.camperSlot{
  width:34px;height:34px;
  border-radius:8px;
  border:1.5px dashed #059669;
  background:#f0fdf4;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.camperSlot.occupied{
  border:2px solid #16a34a;
  background:#dcfce7;
}
.camperSlot .o{--s:27px}

/* ===== 第 4 題專屬：6 個陶瓷碗裝士多啤梨 ===== */
.bowlGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
@media(max-width:680px){
  .bowlGrid{grid-template-columns:repeat(2,1fr)}
}
.bowlCard{
  background:linear-gradient(180deg,#ffffff,#fff1f2);
  border:2.5px solid #fb7185;
  border-radius:18px;
  padding:10px;
  text-align:center;
  box-shadow:0 7px 0 #fecdd3;
  transition:transform .2s;
}
.bowlCard.bonus-bowl{
  border-color:var(--red);
  border-width:3.5px;
  background:linear-gradient(180deg,#fff1f2,#ffe4e6);
  box-shadow:0 7px 0 #fda4af,0 0 0 4px rgba(225,29,72,.2);
}
.ceramicBowlBody{
  min-height:82px;
  padding:8px;
  margin:6px 0;
  border-radius:12px 12px 38px 38px;
  border:3px solid #e11d48;
  background:radial-gradient(circle at 50% 30%,#ffffff 40%,#ffe4e6 100%);
  box-shadow:inset 0 -6px 10px rgba(225,29,72,.12),0 4px 0 #fda4af;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:2px;
}

/* ===== 第 5 題專屬：合唱團舞台排練（每排剛好站 9 人） ===== */
.choirStageWrap{

.choirRowCard{

  background:#fff1f2;
  box-shadow:0 4px 0 #fecdd3;
}
.choirRiserSlots{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
}
.singerSpot{
  width:36px;height:36px;
  border-radius:50%;
  border:2px dashed #cbd5e1;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.singerSpot.filled{
  border:2px solid #0284c7;
  background:#e0f2fe;
}
.singerSpot.missing-spot{
  border:2.5px dashed var(--red);
  background:#ffe4e6;
  animation:pulseBtn 1.1s infinite;
}
.singerSpot.missing-spot::after{
  content:'欠1';
  position:absolute;
  bottom:-5px;
  background:var(--red);
  color:#fff;
  font-size:9.5px;
  font-weight:900;
  padding:0 4px;
  border-radius:4px;
}

<script>
/* ================== 五道題目分物資料 ================== */
const WORKSHEET_QS = [

/* ================== 狀態管理 ================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const S = {
  cur: 0,
  kwOn: false,
  sims: []
};
let busy = false;

function initSimForQ(q) {
  if (q.qNo === 1) {
    return {
      remainLen: 90,
      cuts: 0,
      justCut: false,
      done: false,
      remChecked: false,
      msg: '👆 點擊下方「✂️ 剪出 1 段 8 厘米絲帶做蝴蝶結」，觀察剪刀把絲帶每 8 厘米剪下一段！'
    };
  }
  if (q.qNo === 2) {
    return {
      rods: 8,
      loose: 0,
      pods: [0],
      done: false,
      remChecked: false,
      msg: '👆 點擊上方「10 個金幣袋」拆開，或按「⭕ 用 6 個金幣解鎖 1 個角色」，看看 80 個金幣最多可解鎖多少個角色！'
    };
  }
  if (q.qNo === 3) {
    return {
      rods: 7,
      loose: 6,
      tents: [0],
      done: false,
      remHandled: false,
      msg: '👆 點擊「⛺ 安排 6 人住進 1 個帳篷」（或點選上方學生），住滿後按「➕ 搭建新帳篷」讓所有學生都有地方休息！'
    };
  }
  if (q.qNo === 4) {
    return {
      rods: 7,
      loose: 0,
      bowls: [0, 0, 0, 0, 0, 0],
      done: false,
      remHandled: false,
      msg: '👆 點擊「🍓 平均派發下一輪（每碗分 1 粒）」或「⚡ 每碗先分 10 粒」，分完後再把剩餘的士多啤梨放進 1 號碗內！'
    };
  }
  return {
    rods: 8,
    loose: 4,
    rows: [0],
    done: false,
    remHandled: false,
    msg: '👆 點擊「🎶 排好下一排（站滿 9 人）」，排完所有滿排後，把剩下的學生排到最後一排，數一數紅框空位尚欠多少人！'
  };
}

WORKSHEET_QS.forEach((q, idx) => {
  S.sims[idx] = initSimForQ(q);
});

/* ================== 視覺輔助函數 ================== */
function obj(id, cls='', size) {
  return `<span class="o ${cls}"${size ? ` style="--s:${size}px"` : ''}><svg viewBox="0 0 64 64"><use href="#${id}"/></svg></span>`;
}
function objs(n, id, popLast, size, cls='') {
  let h = '';
  for (let i = 0; i < n; i++) h += obj(id, cls + (popLast && i === n - 1 ? ' pop' : ''), size);
  return h;
}
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g, ''));
  u.lang = 'zh-HK';
  u.rate = 0.92;
  speechSynthesis.speak(u);
}
function sparkle(x, y) {
  const e = ['✨','⭐','🌟'];
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'fx';
    d.textContent = e[i % 3];
    d.style.left = x - 12 + 'px';
    d.style.top = y - 12 + 'px';
    document.body.appendChild(d);
    const a = Math.PI * 2 * i / 5, r = 26 + Math.random() * 16;
    d.animate([
      { transform: 'scale(.3)', opacity: 1 },
      { transform: `translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1.1)`, opacity: 0 }
    ], { duration: 480, easing: 'ease-out' }).onfinish = () => d.remove();
  }
}

/* ================== 題目切換與頂部題目卡渲染 ================== */
function goQuestion(idx) {
  if (busy) return;
  S.cur = idx;
  renderAll();
}

function renderAll() {
  $('#tabs').innerHTML = WORKSHEET_QS.map((q, i) => `
    <button class="tab ${i === S.cur ? 'on' : ''}" onclick="goQuestion(${i})">
      ${obj(q.icon)} 第 ${q.qNo} 題
    </button>
  `).join('');

  renderQuestionBanner();
  renderSimScene();
}

function renderQuestionBanner() {
  const q = WORKSHEET_QS[S.cur];
  $('#qBannerCard').innerHTML = `
    <div class="wsQuestionBox" id="wsQBox">
      ${q.questionParts.join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn warm" id="bToggleKw">${S.kwOn ? '🖍️ 隱藏重點字' : '🖍️ 標示重點字'}</button>
      <button class="btn" id="bSpeakQ">🔊 粵語讀題</button>
    </div>
  `;

  if (S.kwOn) {
    $$('#wsQBox .wsKeywordBox').forEach(el => el.classList.add('circled'));
  }

  $('#bToggleKw').onclick = () => {
    S.kwOn = !S.kwOn;
    renderQuestionBanner();
  };
  $('#bSpeakQ').onclick = () => speak(q.ttsText);
}

/* ================== 全寬度：5 題專屬具象化分物模擬器 ================== */
function renderSimScene() {
  const q = WORKSHEET_QS[S.cur];
  const s = S.sims[S.cur];
  const box = $('#simScene');
  box.className = 'scene ' + q.theme;

  if (q.qNo === 1) renderScene1_Ribbon(q, s, box);
  else if (q.qNo === 2) renderScene2_GameCoins(q, s, box);
  else if (q.qNo === 3) renderScene3_CampTents(q, s, box);
  else if (q.qNo === 4) renderScene4_Strawberries(q, s, box);
  else renderScene5_ChoirStage(q, s, box);
}

/* ---------- 第 1 題（P.2）：90 厘米絲帶，每 8 厘米剪成一段做蝴蝶結（配備真實剪刀開合動畫） ---------- */
function renderScene1_Ribbon(q, s, box) {
  const cutSegments = [];
  for (let i = 0; i < s.cuts; i++) {
    const isLatestCut = s.justCut && i === s.cuts - 1;
    cutSegments.push(`<div class="ribbonCutSeg ${isLatestCut ? 'just-cut' : ''}" style="width:${(8 / 90) * 100}%">8cm</div>`);
  }
  const remainPct = (s.remainLen / 90) * 100;
  const cutLinePct = Math.min(98, ((s.cuts * 8) / 90) * 100);
  const nextCutLinePct = Math.min(98, (((s.cuts + 1) * 8) / 90) * 100);
  const scissorLeftPct = s.justCut ? cutLinePct : (s.done ? cutLinePct : nextCutLinePct);

  let bowsHtml = '';
  for (let i = 0; i < s.cuts; i++) {
    const isLatest = s.justCut && i === s.cuts - 1;
    bowsHtml += `
      <div class="bowCard">
        ${obj('bow', isLatest ? 'pop glow-item' : '', 44)}
        <b>第 ${i + 1} 段</b>
        <small>長 8 厘米</small>
      </div>
    `;
  }
  if (s.done) {
    bowsHtml += `
      <div class="bowCard rem-card">
        <div style="height:44px;display:flex;align-items:center;justify-content:center">
          <div style="width:36px;height:14px;background:linear-gradient(90deg,#e11d48,#be123c);border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.2)"></div>
        </div>
        <b style="color:var(--red)">餘下絲帶</b>
        <small style="color:var(--red)">不夠 8 厘米剪 1 段！</small>
      </div>
    `;
  }

  let rulerTicksHtml = '';
  for (let cm = 0; cm <= 90; cm += 10) {
    rulerTicksHtml += `<span>| ${cm}cm</span>`;
  }

  box.innerHTML = `
    <div class="zoneHeader">
      <div class="zoneTitle">🎀 老師的長絲帶（總長 90 厘米，每 8 厘米剪成一段做蝴蝶結）</div>
      <span class="tag ${s.done ? 'rem-alert' : ''}">
        ${s.done ? '請觀察下方剪出了多少段、還餘下多少厘米！' : `尚餘絲帶長度：${s.remainLen} 厘米`}
      </span>
    </div>

    <div class="supply ${s.done ? 'rem-mode' : ''}">
      <div class="ribbonSpoolWrap">
        <div class="ribbonRulerTicks">${rulerTicksHtml}</div>
        <div class="ribbonBarOuter">
          <!-- 真實開合立體剪刀 -->
          <div class="scissorActor ${s.justCut ? 'snipping' : ''}" id="scissorActor" style="left:${scissorLeftPct}%;opacity:${s.done && !s.justCut ? '.45' : '1'}">
            <svg viewBox="0 0 64 64" width="54" height="54">
              <g class="blade-top">
                <path d="M28 28 L56 12 C58 16 54 22 48 25 L28 32 Z" fill="url(#gBlade)" stroke="#334155" stroke-width="1.6"/>
                <circle cx="15" cy="18" r="9" fill="none" stroke="#e11d48" stroke-width="4.5"/>
                <line x1="22" y1="22" x2="28" y2="28" stroke="#e11d48" stroke-width="4"/>
              </g>
              <g class="blade-bot">
                <path d="M28 28 L56 44 C58 40 54 34 48 31 L28 24 Z" fill="url(#gBlade)" stroke="#334155" stroke-width="1.6"/>
                <circle cx="15" cy="38" r="9" fill="none" stroke="#e11d48" stroke-width="4.5"/>
                <line x1="22" y1="34" x2="28" y2="28" stroke="#e11d48" stroke-width="4"/>
              </g>
              <circle cx="28" cy="28" r="3" fill="#475569" stroke="#fff" stroke-width="1"/>
            </svg>
          </div>
          <!-- 剪斷瞬間閃光切口線 -->
          <div class="cutFlashLine ${s.justCut ? 'flash' : ''}" style="left:${cutLinePct}%"></div>

          <div class="ribbonBarTrack">
            ${cutSegments.join('')}
            ${s.remainLen > 0 ? `
              <div class="ribbonUncutSeg ${s.done ? 'rem-only' : ''}" style="width:${remainPct}%">
                ${s.done ? `餘 ${s.remainLen}cm` : `未剪絲帶 (${s.remainLen} 厘米)`}
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    </div>

    <div class="zoneHeader" style="margin-top:14px">
      <div class="zoneTitle">✂️ 已剪出的蝴蝶結絲帶段（每段 8 厘米）</div>
    </div>

    <div class="bowShowcaseGrid" id="bowGrid">
      ${bowsHtml || '<div style="grid-column:1/-1;text-align:center;padding:24px;color:#64748b;font-weight:800">（請點擊下方「✂️ 剪出 1 段 8 厘米絲帶」開始分物！）</div>'}
    </div>

    <div class="live">
      ${s.done
        ? '✨ 剪絲帶完成！請自己數一數上面共剪出多少段蝴蝶結絲帶（商），以及最後紅色那一小截還餘下多少厘米（餘數）！'
        : `目前進度：已剪出 <b>${s.cuts}</b> 段（8 × ${s.cuts} ＝ ${s.cuts * 8} 厘米），還剩 <b>${s.remainLen}</b> 厘米`}
    </div>

    <div class="bubble"><span id="msg">💡 ${s.msg}</span></div>

    <div class="ctrl">
      <button class="btn gray" id="bResetSim">🔄 重新剪絲帶</button>
      <button class="btn red" id="bCut1" ${s.done ? 'disabled' : ''}>✂️ 剪出 1 段 8 厘米絲帶（做 1 個蝴蝶結）</button>
      <button class="btn warm" id="bCut5" ${s.done || s.remainLen < 40 ? 'disabled' : ''}>⚡ 連續剪出 5 段（共 40 厘米）</button>
      <button class="btn teal" id="bCutAll" ${s.done ? 'disabled' : ''}>✨ 一鍵剪完所有可剪絲帶</button>
    </div>
  `;

  if (s.justCut) {
    const scEl = $('#scissorActor');
    if (scEl) {
      const r = scEl.getBoundingClientRect();
      sparkle(r.left + r.width / 2, r.top + r.height / 2);
    }
    s.justCut = false;
  }

  $('#bResetSim').onclick = () => { S.sims[0] = initSimForQ(q); renderSimScene(); };
  $('#bCut1').onclick = () => {
    if (s.remainLen >= 8) {
      s.remainLen -= 8;
      s.cuts++;
      s.justCut = true;
      if (s.remainLen < 8) {
        s.done = true;
        s.msg = '🎉 咔嚓！剪完了！剩下的絲帶不足 8 厘米，不夠再做 1 個蝴蝶結！請數一數剪了多少段、還餘下多少厘米！';
      } else {
        s.msg = `✂️ 咔嚓！剪出第 ${s.cuts} 段（用去 ${s.cuts * 8} 厘米），絲帶還剩 ${s.remainLen} 厘米！`;
      }
      renderSimScene();
    }
  };
  $('#bCut5').onclick = async () => {
    if (busy) return;
    busy = true;
    for (let k = 0; k < 5 && s.remainLen >= 8; k++) {
      s.remainLen -= 8;
      s.cuts++;
      s.justCut = true;
      if (s.remainLen < 8) s.done = true;
      renderSimScene();
      await new Promise(r => setTimeout(r, 260));
    }
    busy = false;
  };
  $('#bCutAll').onclick = () => {
    s.cuts = q.qt;
    s.remainLen = q.rem;
    s.justCut = true;
    s.done = true;
    s.msg = '🎉 剪完了！最後剩下的絲帶不夠 8 厘米，這就是「餘數」！題目有 2 個問號，記得把「商」和「餘數」都寫進答句！';
    renderSimScene();
  };
}

/* ---------- 第 2 題（P.3）：80 個金幣，每 6 個金幣解鎖 1 個隱藏角色 ---------- */
function renderScene2_GameCoins(q, s, box) {
  const totalRemain = s.rods * 10 + s.loose;
  const fullPods = s.pods.filter(c => c === 6).length;

  let supplyHtml = '';
  for (let r = 0; r < s.rods; r++) {
    supplyHtml += `
      <div class="pack" data-open-rod="${r}">
        <div class="tube">${objs(10, 'coin', false, 18)}</div>
        <small>💰 10 個金幣袋</small>
        <b>👆 點擊拆開</b>
      </div>
    `;
  }
  for (let i = 0; i < s.loose; i++) {
    supplyHtml += obj('coin', 'item loose-coin' + (s.done ? ' rem-item' : ''), 36);
  }

  let podsHtml = '';
  s.pods.forEach((c, idx) => {
    const isFull = c === 6;
    const isRemPod = s.done && !isFull && c > 0;
    let slots = '';
    for (let k = 0; k < 6; k++) {
      slots += `<div class="cSlot ${k < c ? 'filled' : ''}">${k < c ? obj('coin', 'pop', 22) : ''}</div>`;
    }
    podsHtml += `
      <div class="heroPodCard ${isFull ? 'unlocked' : isRemPod ? 'not-enough' : ''}">
        <div style="font-weight:900;font-size:13.5px;color:${isFull ? '#15803d' : '#334155'}">
          ${isFull ? `✅ 角色 #${idx + 1}` : `🔒 角色盲盒 #${idx + 1}`}
        </div>
        <div style="margin:4px 0">
          ${isFull ? obj('hero', 'pop glow-item', 44) : `<span style="font-size:28px;opacity:.45">🦸</span>`}
        </div>
        <div class="coinSlots6">${slots}</div>
        <div style="font-size:12px;font-weight:900;color:${isFull ? '#16a34a' : '#64748b'}">
          ${isFull ? '已滿 6 個金幣解鎖！' : `已放 ${c} / 6 個金幣`}
        </div>
      </div>
    `;
  });

  box.innerHTML = `
    <div class="zoneHeader">
      <div class="zoneTitle">👛 家明收集的 80 個遊戲金幣（點選金幣投入下方解鎖角色）</div>
      <span class="tag ${s.done ? 'rem-alert' : ''}">
        ${s.done ? '請觀察上方剩下的金幣夠不夠 6 個！' : `尚未使用的金幣：${totalRemain} 個`}
      </span>
    </div>

    <div class="supply ${s.done ? 'rem-mode' : ''}" id="coinSupply">
      ${supplyHtml}
      ${s.done && s.remChecked ? `<span style="font-weight:900;color:var(--red);margin-left:8px">✖ 剩下的金幣不夠 6 個，不能解鎖多 1 個角色！（只要「商」）</span>` : ''}
    </div>

    <div class="zoneHeader" style="margin-top:14px">
      <div class="zoneTitle">🎮 隱藏角色解鎖區（每放滿 6 個金幣，立即解鎖 1 個隱藏角色）</div>
    </div>

    <div class="heroUnlockGrid">
      ${podsHtml}
    </div>

    <div class="live">
      ${s.done
        ? '✨ 金幣分完了！請自己數一數下方成功解鎖了多少個隱藏角色（商），以及上方還剩下多少個金幣（餘數）！'
        : `目前進度：已解鎖 <b>${fullPods}</b> 個隱藏角色（用去 ${fullPods * 6} 個金幣），上方還剩 <b>${totalRemain}</b> 個金幣`}
    </div>

    <div class="bubble"><span id="msg">💡 ${s.msg}</span></div>

    <div class="ctrl">
      <button class="btn gray" id="bResetSim">🔄 重新分金幣</button>
      <button class="btn warm" id="bSplit10" ${!s.done && s.rods > 0 ? '' : 'disabled'}>🔨 拆開 1 袋十位 (10 ➔ 10個1)</button>
      <button class="btn green" id="bUnlockNext" ${!s.done ? '' : 'disabled'}>⭕ 用 6 個金幣解鎖下一個角色</button>
      <button class="btn teal" id="bUnlockAll" ${!s.done ? '' : 'disabled'}>✨ 一鍵解鎖所有可換角色</button>
      ${s.done && !s.remChecked ? `<button class="btn red pulse" id="bCheckRemCoin">💡 試試用剩下的金幣解鎖？</button>` : ''}
    </div>
  `;

  $$('[data-open-rod]').forEach(el => {
    el.onclick = () => {
      if (s.rods > 0) {
        s.rods--;
        s.loose += 10;
        s.msg = `🔨 已拆開 1 袋十位金幣，變成 10 個單粒金幣！`;
        renderSimScene();
      }
    };
  });

  $$('#coinSupply .loose-coin').forEach(el => {
    el.onclick = () => {
      if (s.done) {
        s.remChecked = true;
        s.msg = '🤔 剩下的金幣不夠 6 個，遊戲機台不接受！所以「最多」只可解鎖已滿 6 個金幣的角色（只要「商」）！';
        renderSimScene();
        return;
      }
      putOneCoinIntoPod(q, s);
    };
  });

  $('#bResetSim').onclick = () => { S.sims[1] = initSimForQ(q); renderSimScene(); };
  $('#bSplit10').onclick = () => {
    if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); }
  };
  $('#bUnlockNext').onclick = () => {
    const curPodIdx = s.pods.length - 1;
    const need = 6 - s.pods[curPodIdx];
    for (let k = 0; k < need; k++) {
      if (s.loose === 0 && s.rods > 0) { s.rods--; s.loose += 10; }
      if (s.loose > 0) putOneCoinIntoPod(q, s, true);
    }
    renderSimScene();
  };
  $('#bUnlockAll').onclick = () => {
    s.rods = 0;
    s.loose = q.rem;
    s.pods = Array(q.qt).fill(6);
    s.done = true;
    s.msg = '🎉 完成分物！上方剩下的金幣不夠 6 個，不能解鎖下一個角色。請數一數共解鎖了多少個角色！';
    renderSimScene();
  };
  if ($('#bCheckRemCoin')) {
    $('#bCheckRemCoin').onclick = () => {
      s.remChecked = true;
      s.msg = '✖ 剩下的金幣不夠 6 個，不能解鎖多 1 個角色！所以答題處理要選【只要「商」】！';
      renderSimScene();
    };
  }
}

function putOneCoinIntoPod(q, s, silent = false) {
  let idx = s.pods.length - 1;
  if (s.pods[idx] >= 6) {
    s.pods.push(0);
    idx++;
  }
  s.loose--;
  s.pods[idx]++;
  const fullCount = s.pods.filter(c => c === 6).length;
  const remTotal = s.rods * 10 + s.loose;
  if (fullCount === q.qt && remTotal === q.rem) {
    s.done = true;
    s.msg = '🎉 已經解鎖了所有夠 6 個金幣的角色！看看上方還剩下多少個金幣？夠不夠 6 個再解鎖 1 個？';
  } else if (s.pods[idx] === 6 && remTotal >= 6) {
    s.pods.push(0);
  }
  if (!silent) renderSimScene();
}

/* ---------- 第 3 題（P.4 - P.5）：76 名學生參加露營，每個帳篷最多睡 6 人（真實圓頂露營帳篷） ---------- */
function renderScene3_CampTents(q, s, box) {
  const totalRemain = s.rods * 10 + s.loose;
  const fullTents = s.tents.filter(c => c === 6).length;

  let supplyHtml = '';
  for (let r = 0; r < s.rods; r++) {
    supplyHtml += `
      <div class="pack" data-open-camp="${r}">
        <div class="tube" style="background:linear-gradient(180deg,#d1fae5,#6ee7b7)">${objs(10, 'camper', false, 18)}</div>
        <small>⛺ 10 人露營小隊</small>
        <b>👆 點擊拆開</b>
      </div>
    `;
  }
  for (let i = 0; i < s.loose; i++) {
    supplyHtml += obj('camper', 'item loose-camper' + (s.done && !s.remHandled ? ' rem-item' : ''), 36);
  }

  let tentsHtml = '';
  s.tents.forEach((c, idx) => {
    const isFull = c === 6;
    const isExtraTent = idx >= q.qt;
    let slots = '';
    for (let k = 0; k < 6; k++) {
      slots += `<div class="camperSlot ${k < c ? 'occupied' : ''}">${k < c ? obj('camper', 'pop', 26) : ''}</div>`;
    }
    tentsHtml += `
      <div class="tentCard ${isFull ? 'full-tent' : ''} ${isExtraTent ? 'extra-tent' : ''}">
        <div class="tentVisualHeader">
          <span class="tentLanternTag">第 ${idx + 1} 頂</span>
          ${isFull || isExtraTent ? `<span class="tentStarDeco">✨</span>` : ''}
          <svg class="tent-svg-wrap" viewBox="0 0 96 64"><use href="#tent"/></svg>
        </div>
        <div style="font-weight:900;font-size:13.5px;color:${isExtraTent ? '#b45309' : '#065f46'};margin-bottom:2px">
          ${isFull ? '✅ 已住滿 6 人' : `⛺ 已入住 ${c} / 6 人`}
        </div>
        <div class="camperSlots6">${slots}</div>
        <div style="font-size:11.5px;font-weight:800;color:${isExtraTent ? '#b45309' : '#047857'}">
          ${isExtraTent ? '🌟 為餘下學生加搭的新帳篷！' : isFull ? '營燈亮起・安心休息' : '請點擊上方學生入住'}
        </div>
      </div>
    `;
  });

  box.innerHTML = `
    <div class="zoneHeader">
      <div class="zoneTitle">🎒 等候入營的露營學生（共 76 名，每個帳篷最多睡 6 人）</div>
      <span class="tag ${s.done && !s.remHandled ? 'rem-alert' : ''}">
        ${s.remHandled ? '✅ 所有學生都已住進帳篷！' : s.done ? '⚠️ 還有餘下的學生未有帳篷住！' : `等候入營人數：${totalRemain} 名`}
      </span>
    </div>

    <div class="supply ${s.done && !s.remHandled ? 'rem-mode' : ''}" id="campSupply">
      ${supplyHtml || '<span style="font-weight:900;color:var(--green)">🎉 全部 76 名學生都已經住進帳篷休息了！請數一數下方共有多少個帳篷！</span>'}
    </div>

    <div class="zoneHeader" style="margin-top:14px">
      <div class="zoneTitle">⛺ 露營帳篷營地（每個帳篷最多睡 6 人）</div>
      <div style="display:flex;gap:6px">
        <button class="btn green" id="bAddTent" style="padding:5px 12px;min-height:34px;font-size:13.5px">➕ 搭建 1 個新帳篷</button>
      </div>
    </div>

    <div class="tentGrid">
      ${tentsHtml}
    </div>

    <div class="live">
      ${s.remHandled
        ? '✨ 所有學生都有帳篷休息了！請數一數「住滿 6 人的帳篷（商）」再加上「為餘下學生多搭的 1 個帳篷」，合共有多少個帳篷！'
        : s.done
        ? '⚠️ 住滿帳篷後，上方還剩下幾名學生！他們不可以沒有地方休息，請點擊「➕ 為餘下學生加搭 1 個新帳篷」！'
        : `目前進度：已住滿 <b>${fullTents}</b> 個帳篷（6 × ${fullTents} ＝ ${fullTents * 6} 人），還剩 <b>${totalRemain}</b> 名學生`}
    </div>

    <div class="bubble"><span id="msg">💡 ${s.msg}</span></div>

    <div class="ctrl">
      <button class="btn gray" id="bResetSim">🔄 重新安排露營</button>
      <button class="btn warm" id="bSplitCamp" ${!s.done && s.rods > 0 ? '' : 'disabled'}>🔨 拆開 10 人小隊 (10 ➔ 10個1)</button>
      <button class="btn green" id="bFillOneTent" ${!s.done ? '' : 'disabled'}>⛺ 安排 6 人住滿 1 個帳篷</button>
      <button class="btn teal" id="bFillAllTents" ${!s.done ? '' : 'disabled'}>✨ 一鍵安排好所有滿額帳篷</button>
      ${s.done && !s.remHandled ? `<button class="btn red pulse" id="bHandleExtraTent">➕ 為餘下的學生加搭 1 個新帳篷（「商」+ 1）</button>` : ''}
    </div>
  `;

  $$('[data-open-camp]').forEach(el => {
    el.onclick = () => {
      if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); }
    };
  });

  $$('#campSupply .loose-camper').forEach(el => {
    el.onclick = () => {
      if (s.done && !s.remHandled) {
        addExtraTentForRemainder(q, s);
        return;
      }
      putOneCamperIntoTent(q, s);
    };
  });

  $('#bAddTent').onclick = () => {
    if (s.done && !s.remHandled) {
      addExtraTentForRemainder(q, s);
      return;
    }
    if (s.tents[s.tents.length - 1] < 6) {
      s.msg = `⚠️ 第 ${s.tents.length} 個帳篷還未住滿 6 人，請先住滿再搭新帳篷！`;
      renderSimScene();
      return;
    }
    if (totalRemain > 0) {
      s.tents.push(0);
      renderSimScene();
    }
  };

  $('#bResetSim').onclick = () => { S.sims[2] = initSimForQ(q); renderSimScene(); };
  $('#bSplitCamp').onclick = () => { if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); } };
  $('#bFillOneTent').onclick = () => {
    if (s.tents[s.tents.length - 1] >= 6) s.tents.push(0);
    const idx = s.tents.length - 1;
    const need = 6 - s.tents[idx];
    for (let k = 0; k < need; k++) {
      if (s.loose === 0 && s.rods > 0) { s.rods--; s.loose += 10; }
      if (s.loose > 0) putOneCamperIntoTent(q, s, true);
    }
    renderSimScene();
  };
  $('#bFillAllTents').onclick = () => {
    s.rods = 0;
    s.loose = q.rem;
    s.tents = Array(q.qt).fill(6);
    s.done = true;
    s.msg = '⚠️ 住滿帳篷後，上方還剩下幾名學生！為了讓所有學生都有地方休息，請點擊紅色的「➕ 加搭 1 個新帳篷」按鈕！';
    renderSimScene();
  };
  if ($('#bHandleExtraTent')) {
    $('#bHandleExtraTent').onclick = () => addExtraTentForRemainder(q, s);
  }
}

function putOneCamperIntoTent(q, s, silent = false) {
  let idx = s.tents.length - 1;
  if (s.tents[idx] >= 6) {
    s.tents.push(0);
    idx++;
  }
  s.loose--;
  s.tents[idx]++;
  const fullCount = s.tents.filter(c => c === 6).length;
  const remTotal = s.rods * 10 + s.loose;
  if (fullCount === q.qt && remTotal === q.rem) {
    s.done = true;
    s.msg = '⚠️ 已經住滿了 12 個帳篷，上方還剩下幾名學生！請點擊「➕ 搭建 1 個新帳篷」安置他們！';
  }
  if (!silent) renderSimScene();
}

function addExtraTentForRemainder(q, s) {
  s.tents.push(s.loose);
  s.loose = 0;
  s.remHandled = true;
  s.msg = '🎉 已多搭 1 個新帳篷讓餘下的學生入住！所以最少需要「商 + 1」個帳篷，請自己數一數總帳篷數目寫在工作紙上！';
  renderSimScene();
}

/* ---------- 第 4 題（P.5）：70 粒士多啤梨平均放於 6 個碗，剩餘的再放於其中一個碗內 ---------- */
function renderScene4_Strawberries(q, s, box) {
  const totalRemain = s.rods * 10 + s.loose;
  const minInBowl = Math.min(...s.bowls);

  let supplyHtml = '';
  for (let r = 0; r < s.rods; r++) {
    supplyHtml += `
      <div class="pack" data-open-berry="${r}">
        <div class="tube" style="background:linear-gradient(180deg,#ffe4e6,#fda4af)">${objs(10, 'strawberry', false, 18)}</div>
        <small>🍓 10 粒士多啤梨盒</small>
        <b>👆 點擊拆開</b>
      </div>
    `;
  }
  for (let i = 0; i < s.loose; i++) {
    supplyHtml += obj('strawberry', 'item loose-berry' + (s.done && !s.remHandled ? ' rem-item' : ''), 34);
  }

  let bowlsHtml = '';
  s.bowls.forEach((c, idx) => {
    const isBonusBowl = idx === 0 && s.remHandled;
    bowlsHtml += `
      <div class="bowlCard ${isBonusBowl ? 'bonus-bowl' : ''}" data-bowl="${idx}">
        <div style="font-weight:900;font-size:15px;color:${isBonusBowl ? 'var(--red)' : '#9f1239'}">
          ${isBonusBowl ? '⭐ 第 1 個碗（已放入剩餘的士多啤梨！）' : `🥣 第 ${idx + 1} 個碗`}
        </div>
        <div class="ceramicBowlBody">
          ${objs(c, 'strawberry', false, 24)}
        </div>
        <div style="font-size:15px;font-weight:900;color:${isBonusBowl ? 'var(--red)' : 'var(--main)'}">
          ${isBonusBowl ? '請自己數一數這碗共有多少粒！' : `碗內有 ${c} 粒`}
        </div>
      </div>
    `;
  });

  box.innerHTML = `
    <div class="zoneHeader">
      <div class="zoneTitle">🍓 果籃裏的士多啤梨（共 70 粒，平均放於 6 個碗中）</div>
      <span class="tag ${s.done && !s.remHandled ? 'rem-alert' : ''}">
        ${s.remHandled ? '✅ 已把剩餘的士多啤梨放進第 1 個碗內！' : s.done ? '請把上方剩餘的士多啤梨放進其中一個碗內！' : `尚未分入碗內：${totalRemain} 粒`}
      </span>
    </div>

    <div class="supply ${s.done && !s.remHandled ? 'rem-mode' : ''}" id="berrySupply">
      ${supplyHtml || '<span style="font-weight:900;color:var(--green)">✨ 剩餘的士多啤梨已全部放進「第 1 個碗」裏！請點算第 1 個碗共有多少粒！</span>'}
    </div>

    <div class="zoneHeader" style="margin-top:14px">
      <div class="zoneTitle">🥣 6 個陶瓷碗（平均分配後，把剩餘的再放於其中一個碗內）</div>
    </div>

    <div class="bowlGrid">
      ${bowlsHtml}
    </div>

    <div class="live">
      ${s.remHandled
        ? '✨ 完成！第 1 個碗原本平均分得「商」粒，再放進剩餘的「餘數」粒，請數一數第 1 個碗現在共有多少粒！'
        : s.done
        ? '🍓 6 個碗已經平均分好！上方剩下的不夠 6 個碗再各分 1 粒。請點擊下方紅色按鈕「📥 把剩餘的放於其中一個碗內」！'
        : `目前進度：每個碗已平均分得 <b>${minInBowl}</b> 粒（6 × ${minInBowl} ＝ ${minInBowl * 6} 粒），上方還剩 <b>${totalRemain}</b> 粒`}
    </div>

    <div class="bubble"><span id="msg">💡 ${s.msg}</span></div>

    <div class="ctrl">
      <button class="btn gray" id="bResetSim">🔄 重新分士多啤梨</button>
      <button class="btn warm" id="bSplitBerry" ${!s.done && s.rods > 0 ? '' : 'disabled'}>🔨 拆開 1 盒十位 (10 ➔ 10粒)</button>
      <button class="btn green" id="bShare10Each" ${!s.done && minInBowl === 0 ? '' : 'disabled'}>⚡ 先給 6 個碗每碗放 10 粒（共 60 粒）</button>
      <button class="btn teal" id="bShareRound" ${!s.done ? '' : 'disabled'}>🍓 平均派發下一輪（6 個碗各放 1 粒）</button>
      <button class="btn" id="bShareAll" ${!s.done ? '' : 'disabled'}>✨ 一鍵完成平均分碗</button>
      ${s.done && !s.remHandled ? `<button class="btn red pulse" id="bPutRemInBowl1">📥 把剩餘的士多啤梨放於其中一個碗內（「商」+「餘數」）</button>` : ''}
    </div>
  `;

  $$('[data-open-berry]').forEach(el => {
    el.onclick = () => { if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); } };
  });

  $$('#berrySupply .loose-berry').forEach(el => {
    el.onclick = () => {
      if (s.done && !s.remHandled) {
        putRemainingBerriesIntoBowl1(s);
        return;
      }
      const minVal = Math.min(...s.bowls);
      const targetIdx = s.bowls.indexOf(minVal);
      s.loose--;
      s.bowls[targetIdx]++;
      checkBerryShareDone(q, s);
      renderSimScene();
    };
  });

  $('#bResetSim').onclick = () => { S.sims[3] = initSimForQ(q); renderSimScene(); };
  $('#bSplitBerry').onclick = () => { if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); } };
  $('#bShare10Each').onclick = () => {
    if (s.rods >= 6 && Math.min(...s.bowls) === 0) {
      s.rods -= 6;
      s.bowls = [10, 10, 10, 10, 10, 10];
      s.msg = '⚡ 每個碗已先放入 10 粒（共 60 粒）！還剩 10 粒，請拆開並繼續平均分給 6 個碗！';
      renderSimScene();
    }
  };
  $('#bShareRound').onclick = () => {
    const targetVal = Math.min(...s.bowls) + 1;
    for (let b = 0; b < 6; b++) {
      while (s.bowls[b] < targetVal) {
        if (s.loose === 0 && s.rods > 0) { s.rods--; s.loose += 10; }
        if (s.loose > 0) { s.loose--; s.bowls[b]++; } else break;
      }
    }
    checkBerryShareDone(q, s);
    renderSimScene();
  };
  $('#bShareAll').onclick = () => {
    s.rods = 0;
    s.loose = q.rem;
    s.bowls = Array(6).fill(q.qt);
    s.done = true;
    s.msg = '🎉 6 個碗已平均分好！請點擊紅色按鈕「📥 把剩餘的士多啤梨放於其中一個碗內」！';
    renderSimScene();
  };
  if ($('#bPutRemInBowl1')) {
    $('#bPutRemInBowl1').onclick = () => putRemainingBerriesIntoBowl1(s);
  }
}

function checkBerryShareDone(q, s) {
  if (s.bowls.every(v => v === q.qt) && (s.rods * 10 + s.loose) === q.rem) {
    s.done = true;
    s.msg = '🎉 6 個碗已平均分好！上方剩下的不夠每碗再分 1 粒，請點擊「📥 把剩餘的放於其中一個碗內」！';
  }
}

function putRemainingBerriesIntoBowl1(s) {
  s.bowls[0] += s.loose;
  s.loose = 0;
  s.remHandled = true;
  s.msg = '🎉 已把剩餘的士多啤梨全部放進「第 1 個碗」內！這就是「商 + 餘數」，請自己數一數第 1 個碗共有多少粒！';
  renderSimScene();
}

/* ---------- 第 5 題（P.6）：合唱團共有 84 名學生，每排剛好站 9 人，為了讓最後一排站滿 9 人，尚欠多少名？ ---------- */
function renderScene5_ChoirStage(q, s, box) {
  const totalRemain = s.rods * 10 + s.loose;
  const fullRows = s.rows.filter(c => c === 9).length;

  let supplyHtml = '';
  for (let r = 0; r < s.rods; r++) {
    supplyHtml += `
      <div class="pack" data-open-choir="${r}">
        <div class="tube" style="background:linear-gradient(180deg,#e0f2fe,#7dd3fc)">${objs(10, 'singer', false, 18)}</div>
        <small>🎶 10 名合唱團員</small>
        <b>👆 點擊拆開</b>
      </div>
    `;
  }
  for (let i = 0; i < s.loose; i++) {
    supplyHtml += obj('singer', 'item loose-singer' + (s.done && !s.remHandled ? ' rem-item' : ''), 34);
  }

  let rowsHtml = '';
  s.rows.forEach((c, idx) => {
    const isFull = c === 9;
    const isLastIncomplete = s.remHandled && idx === q.qt && c > 0 && c < 9;
    let spots = '';
    for (let k = 0; k < 9; k++) {
      if (k < c) {
        spots += `<div class="singerSpot filled">${obj('singer', 'pop', 28)}</div>`;
      } else if (isLastIncomplete) {
        spots += `<div class="singerSpot missing-spot">${obj('singer', 'ghost', 25)}</div>`;
      } else {
        spots += `<div class="singerSpot"><span style="font-size:11px;color:#94a3b8;font-weight:900">${k + 1}</span></div>`;
      }
    }
    rowsHtml += `
      <div class="choirRowCard ${isLastIncomplete ? 'incomplete-row' : ''}">
        <div style="font-weight:900;font-size:14.5px;color:${isLastIncomplete ? 'var(--red)' : '#854d0e'};min-width:130px">
          ${isFull ? `✅ 第 ${idx + 1} 排 (滿9人)` : isLastIncomplete ? `⚠️ 最後一排 (只有 ${c} 人)` : `🎶 第 ${idx + 1} 排 (${c}/9人)`}
        </div>
        <div class="choirRiserSlots">${spots}</div>
        <div style="font-size:13px;font-weight:900;color:${isLastIncomplete ? 'var(--red)' : '#15803d'}">
          ${isLastIncomplete ? '👈 請數一數紅框「欠1」空位共有幾個！' : isFull ? '站滿 9 人' : '等候排隊'}
        </div>
      </div>
    `;
  });

  box.innerHTML = `
    <div class="zoneHeader">
      <div class="zoneTitle">🎤 台下等候排隊的合唱團學生（共 84 名，每排剛好站 9 人）</div>
      <span class="tag ${s.done && !s.remHandled ? 'rem-alert' : ''}">
        ${s.remHandled ? '🔍 請數一數最後一排的紅色虛線空位尚欠多少人！' : s.done ? '請把剩下的學生排到最後一排看看還欠多少人！' : `台下等候人數：${totalRemain} 名`}
      </span>
    </div>

    <div class="supply ${s.done && !s.remHandled ? 'rem-mode' : ''}" id="choirSupply">
      ${supplyHtml || '<span style="font-weight:900;color:var(--red)">🔍 所有 84 名學生已站上舞台！請看下方「最後一排」還差多少個紅色虛線空位才站滿 9 人！</span>'}
    </div>

    <div class="zoneHeader" style="margin-top:14px">
      <div class="zoneTitle">🎼 合唱團舞台階梯（老師希望每排剛好站滿 9 人）</div>
    </div>

    <div class="choirStageWrap">
      ${rowsHtml}
    </div>

    <div class="live">
      ${s.remHandled
        ? '✨ 請觀察舞台最後一排：每排要站滿 9 人（除數），現在只有餘下的學生站上去（餘數），數一數紅框「欠1」空位尚欠多少名學生！'
        : s.done
        ? '🎶 前面的排數已經全部站滿 9 人！台下還剩下幾名學生不夠站滿一排，請點擊「🔍 把剩下的學生排上最後一排」！'
        : `目前進度：已站滿 <b>${fullRows}</b> 排（9 × ${fullRows} ＝ ${fullRows * 9} 人），台下還剩 <b>${totalRemain}</b> 名學生`}
    </div>

    <div class="bubble"><span id="msg">💡 ${s.msg}</span></div>

    <div class="ctrl">
      <button class="btn gray" id="bResetSim">🔄 重新排隊</button>
      <button class="btn warm" id="bSplitChoir" ${!s.done && s.rods > 0 ? '' : 'disabled'}>🔨 拆開 10 人小隊 (10 ➔ 10個1)</button>
      <button class="btn green" id="bFillOneRow" ${!s.done ? '' : 'disabled'}>🎶 排滿下一排（站滿 9 人）</button>
      <button class="btn teal" id="bFillAllRows" ${!s.done ? '' : 'disabled'}>✨ 一鍵排好所有滿 9 人的排數</button>
      ${s.done && !s.remHandled ? `<button class="btn red pulse" id="bShowLastRowMissing">🔍 把剩下的學生排上最後一排，看看尚欠多少人！（除數 - 餘數）</button>` : ''}
    </div>
  `;

  $$('[data-open-choir]').forEach(el => {
    el.onclick = () => { if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); } };
  });

  $$('#choirSupply .loose-singer').forEach(el => {
    el.onclick = () => {
      if (s.done && !s.remHandled) {
        putRemainingSingersToLastRow(s);
        return;
      }
      putOneSingerIntoRow(q, s);
    };
  });

  $('#bResetSim').onclick = () => { S.sims[4] = initSimForQ(q); renderSimScene(); };
  $('#bSplitChoir').onclick = () => { if (s.rods > 0) { s.rods--; s.loose += 10; renderSimScene(); } };
  $('#bFillOneRow').onclick = () => {
    if (s.rows[s.rows.length - 1] >= 9) s.rows.push(0);
    const idx = s.rows.length - 1;
    const need = 9 - s.rows[idx];
    for (let k = 0; k < need; k++) {
      if (s.loose === 0 && s.rods > 0) { s.rods--; s.loose += 10; }
      if (s.loose > 0) putOneSingerIntoRow(q, s, true);
    }
    renderSimScene();
  };
  $('#bFillAllRows').onclick = () => {
    s.rods = 0;
    s.loose = q.rem;
    s.rows = Array(q.qt).fill(9);
    s.done = true;
    s.msg = '🎶 已經站滿了 9 排（共 81 人），台下還剩下幾名學生！請點擊紅色按鈕把他們排上最後一排，看看還欠幾人才站滿 9 人！';
    renderSimScene();
  };
  if ($('#bShowLastRowMissing')) {
    $('#bShowLastRowMissing').onclick = () => putRemainingSingersToLastRow(s);
  }
}

function putOneSingerIntoRow(q, s, silent = false) {
  let idx = s.rows.length - 1;
  if (s.rows[idx] >= 9) {
    s.rows.push(0);
    idx++;
  }
  s.loose--;
  s.rows[idx]++;
  const fullCount = s.rows.filter(c => c === 9).length;
  const remTotal = s.rods * 10 + s.loose;
  if (fullCount === q.qt && remTotal === q.rem) {
    s.done = true;
    s.msg = '🎶 前面已經站滿了！請點擊紅色按鈕，把台下剩下的學生排到最後一排，看看尚欠多少名學生才站滿 9 人！';
  }
  if (!silent) renderSimScene();
}

function putRemainingSingersToLastRow(s) {
  s.rows.push(s.loose);
  s.loose = 0;
  s.remHandled = true;
  s.msg = '🔍 看！最後一排每排要站 9 人（除數），現在只有餘下的學生站上去，請數一數紅框「欠1」空位共有幾個，然後在工作紙列寫「除數 - 餘數」算式！';
  renderSimScene();
}

// 啟動渲染
renderAll();
</script>
</body>
</html>
